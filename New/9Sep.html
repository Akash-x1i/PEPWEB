<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Table Example</title>
	<style>
		#first-row {
			background-color: #f2dede; 
			font-family: 'Arial', sans-serif;
			font-weight: bold;
		}
		.highlight-last {
			background-color: #e8f5e9; 
			font-style: italic;
		}

		table { border-collapse: collapse; width: 60%; }
		th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
	</style>
</head>
<body>

	<table>
		<thead>
			<tr>
				<th>Reg No</th>
				<th>Name</th>
				<th>Role</th>
			</tr>
		</thead>
		<tbody>
			<tr id="first-row">
				<td>Row1 - Cell1</td>
				<td>Row1 - Cell2</td>
				<td>Row1 - Cell3</td>
			</tr>
			<tr>
				<td>Row2 - Cell1</td>
				<td>Row2 - Cell2</td>
				<td>Row2 - Cell3</td>
			</tr>
			<tr class="highlight-last">
				<td>Row3 - Cell1</td>
				<td>Row3 - Cell2</td>
				<td>Row3 - Cell3</td>
			</tr>
		</tbody>
	</table>

</body>
</html>
