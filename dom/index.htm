<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="block border-solid border-lime-500 h-20 m-10 p-10"></div>
    <div class="block border border-solid border-lime-500 h-60 m-10 p-10">
        <input class="border border-black" type="number" id="num1"><br>
        <input class="border border-black" type="number" id="num2">
        <br>
        <p class="my-6">
            Result : <span id="result" class="mx-4 px-2 py-1 bg-gray-200"></span>
        </p> 
        <br>
        <button class="p-4 border border-gray-200" onclick="multiply()">Multiply</button>
    </div>
    <div class="block border-solid border-lime-500 h-20 m-10"></div>
</body>
<script>
    function multiply(){
        const num1 = Number(document.getElementById("num1").value)
        const num2 = Number(document.getElementById("num2").value)
        console.log(num1 + " " + num2);
        
        document.getElementById("result").innerHTML = (num1 * num2);
    }
</script>
</html>
